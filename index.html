        function VocabChart({ data, label, color, extraData, extraLabel }) {
          const max = Math.max(...data, ...(extraData || []));
          return (
            <div style={{ marginTop: 16 }}>
              <div style={{ display: "flex", gap: 16, marginBottom: 8, flexWrap: "wrap" }}>
                <span style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 12, color: "var(--color-text-secondary)" }}>
                  <span style={{ width: 10, height: 10, borderRadius: 2, background: color.border }}></span>{label}
                </span>
                {extraData && <span style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 12, color: "var(--color-text-secondary)" }}>
                  <span style={{ width: 10, height: 10, borderRadius: 2, border: `2px dashed ${color.border}`, background: "transparent" }}></span>{extraLabel}
                </span>}
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(12, 1fr)", gap: 4, alignItems: "end", height: 80 }}>
                {data.map((v, i) => (
                  <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2 }}>
                    <div style={{ width: "100%", background: color.border, borderRadius: 2, height: `${Math.round((v / max) * 64)}px`, minHeight: 4 }}></div>
                    {extraData && <div style={{ width: "100%", border: `1.5px dashed ${color.border}`, borderRadius: 2, height: `${Math.round((extraData[i] / max) * 64)}px`, minHeight: 4 }}></div>}
                  </div>
                ))}
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(12, 1fr)", gap: 4, marginTop: 4 }}>
                {data.map((_, i) => (
                  <div key={i} style={{ textAlign: "center", fontSize: 10, color: "var(--color-text-tertiary)" }}>M{i + 1}</div>
                ))}
              </div>
            </div>
          );
        }

                                </a>
                              ) : (
                                <span style={{ fontWeight: 500, fontSize: 14, color: "var(--color-text-primary)" }}>{r.name}</span>
                              )}
                              <span style={{ fontSize: 10, padding: "1px 6px", borderRadius: 20, background: r.free ? COLORS.korean.bg : COLORS.chinese.bg, color: r.free ? COLORS.korean.text : COLORS.chinese.text }}>{r.free ? "Free" : "Paid"}</span>
                            </div>
                            <div style={{ fontSize: 11, color: "var(--color-text-tertiary)", marginBottom: 4 }}>{r.type}</div>
                            <div style={{ fontSize: 13, color: "var(--color-text-secondary)" }}>{r.best}</div>
                            <div style={{ fontSize: 12, color: "var(--color-text-tertiary)", marginTop: 4, fontStyle: "italic" }}>{r.note}</div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {activeSection === "Troubleshooter" && (
                <div>
                  <div style={{ fontSize: 14, color: "var(--color-text-secondary)", marginBottom: 16, lineHeight: 1.6 }}>When you hit a wall, diagnose before you grind harder. Every plateau has a specific cause and a specific cure.</div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    {troubleshooter.map((t, i) => (
                      <div key={i} style={{ border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-md)", overflow: "hidden" }}>
                        <button onClick={() => setOpenTrouble(openTrouble === i ? null : i)} style={{ width: "100%", display: "flex", justifyContent: "space-between", alignItems: "flex-start", padding: "12px 14px", background: "var(--color-background-primary)", border: "none", cursor: "pointer", textAlign: "left", gap: 8 }}>
                          <div>
                            <div style={{ fontSize: 13, fontWeight: 500, color: "var(--color-text-primary)", marginBottom: 2 }}>"{t.symptom}"</div>
                          </div>
                          <i className={`ti ${openTrouble === i ? "ti-chevron-up" : "ti-chevron-down"}`} aria-hidden="true" style={{ fontSize: 14, color: "var(--color-text-secondary)", flexShrink: 0, marginTop: 2 }}></i>
                        </button>
                        {openTrouble === i && (
                          <div style={{ padding: "0 14px 12px", borderTop: "0.5px solid var(--color-border-tertiary)" }}>
                            <div style={{ marginTop: 10, fontSize: 13, color: "var(--color-text-secondary)", marginBottom: 8 }}>
                              <strong style={{ color: "var(--color-text-primary)" }}>Diagnosis:</strong> {t.diagnosis}
                            </div>
                            <div style={{ fontSize: 13, background: color.bg, padding: "10px 12px", borderRadius: "var(--border-radius-md)", borderLeft: `3px solid ${color.border}`, color: "var(--color-text-secondary)" }}>
                              <strong style={{ color: color.text }}>Prescription:</strong> {t.fix}
                            </div>
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <div style={{ marginTop: 32, padding: "16px 14px", borderTop: "0.5px solid var(--color-border-tertiary)", textAlign: "center" }}>
                <div style={{ fontSize: 14, color: "var(--color-text-secondary)", marginBottom: 8 }}>The only remaining variable is consistent, intelligent effort.</div>
                <div style={{ fontSize: 16, fontWeight: 500, color: "var(--color-text-primary)" }}>시작하세요 · 始めましょう · 开始吧</div>
                <div style={{ fontSize: 12, color: "var(--color-text-tertiary)", marginTop: 4 }}>Start now.</div>
              </div>
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
